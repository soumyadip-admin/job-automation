name: Telegram Pairing (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: SoumyadipSAMCareerBot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP dependency
        run: python -m pip install 'requests>=2.32,<3'

      - name: Send chat ID privately to the bot conversation
        run: python scripts/telegram_pair.py
